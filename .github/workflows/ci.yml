name: Angular CI

on:
  push:
    branches:
      - asem

  pull_request:
    branches:
      - production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: 'npm'

        - name: Install dependencies
          run: npm ci

        - name: Build Angular app
          run: npm run build
        
        - name: Run tests
          run: npm test -- --watch=false